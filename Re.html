<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録フォーム</title>
      <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-brown-300 flex items-center justify-center min-h-screen">

    <div class="bg-white rounded-lg shadow p-4 w-full max-w-md">
    <h1 class="text-lg font-bold mb-6">ユーザー登録💋(*´ε`*)ﾁｭｯﾁｭ</h1>
    <form id="signupForm" class="space-y-4" novalidate>
        
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
                な・ま・え～
            </label>
            <input type="text" 
            id="name" required 
            class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
            placeholder="ハム野まだたろう">
        </div>

        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                ねぇ、メルアド打ってっよ
            </label>      
            <input type="email" 
            id="email" required 
            class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" 
            placeholder="example@mail.com">
        </div>

        <div>
            <label for="password" class="block text-sm font-medum text-gray-700 mb-1">
                    ねぇ、パスワードも打ってよ 
            </label>
            <input type="password" 
            id="password" 
            required
            minlength="8"
            class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">    
        </div>

                <div class="flex items-center gap-2">
        <input type="checkbox" id="agree">
        <label for="agree" class="text-sm text-gray-700">
            利用規約に同意する
        </label>
        </div>

        <p id="message" class="text-sm font-medium"></p>

<button type="submit"
        class="w-full bg-blue-500 text-white py-3 rounded hover:bg-blue-600">登録
    </button>

    </form>
    </div>

    <script>
const form = document.getElementById('signupForm');
const message = document.getElementById('message');

    form.addEventListener("submit", (event) => {
        event.preventDefault();

const name = document.getElementById("name").value.trim();
const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;
const agree = document.getElementById("agree").checked;

if (name === "") {
message.textContent = "名前はなんていうのかな？"
message.className = "text-sm text-red-300 font-medium";
return;
}

if (email === ""){
message.textContent = "あなたのメールアドレスはなにかな？";
message.className = "font-medium text-sm text-red-300";
return;
}

if (password === ""){
message.textContent = "パスワードはなにかな？";
message.className = "font-medium text-sm text-red-300";
return;
}

if (!agree) {
message.textContent = "同意しろよ！";
message.className = "font-medium text-sm text-red-300";
}

message.textContent = "登録できたne!" + name + "もどき";
message.className = "font-medium text-sm text-green-300";
});

    </script>
</body>
</html>
