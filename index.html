<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録フォーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-100 flex items-center justify-center min-h-screen">

    <div class="bg-white rounded-lg shadow p-6 w-full max-w-md">
        <h1 class="text-lg font-bold mb-4">ユーザー登録💋(*´ε`*)ﾁｭｯﾁｭ</h1>
        
        <!-- エラーメッセージ表示用の要素を追加 -->
        <p id="message" class="mb-4 text-sm font-medium"></p>

        <form id="signupForm" class="space-y-4" novalidate>
            <!-- 名前 -->
            <div>
                <label for="name" class="block text-sm font-medium mb-1">
                    な・ま・え～
                </label>
                <input type="text" id="name" required class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="ハム野まだたろう">
            </div>

            <!-- メールアドレス -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                    ねぇ、メルアド打ってっよ
                </label>      
                <input type="email" id="email" required class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="example@mail.com">
            </div>

            <!-- パスワード（HTML要素を追加） -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                    ねぇ、パスワードも打ってよ
                </label>
                <input type="password" id="password" required class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <!-- 同意チェックボックス -->
            <div class="flex items-center gap-2">
                <input type="checkbox" id="agree">
                <label for="agree" class="text-sm text-gray-600">
                    利用規約に同意する
                </label>      
            </div>

            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">送信</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('signupForm');
        const message = document.getElementById('message');

        form.addEventListener("submit", (event) => {
            // 画面リロードを防止
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const agree = document.getElementById("agree").checked;

            // バリデーションチェック（上から順に判定）
            if (name === "") {
                message.textContent = "名前はなんていうのかな？";
                message.className = "text-sm text-red-500 font-medium";
                return;
            }

            if (email === "") {
                message.textContent = "あなたのメールアドレスはなにかな？";
                message.className = "font-medium text-sm text-red-500";
                return;
            }

            if (password === "") {
                message.textContent = "パスワードはなにかな？";
                message.className = "font-medium text-sm text-red-500";
                return;
            }

            if (!agree) {
                message.textContent = "同意しro!";
                message.className = "font-medium text-sm text-red-500";
                return;
            }

            // すべてクリアした場合
            message.textContent = "登録成功！(・´з`・)";
            message.className = "font-medium text-sm text-green-500";
        });
    </script>
</body>
</html>
